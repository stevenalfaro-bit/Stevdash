<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stevdash</title>
<style>
  :root {
    --bg1: #050b14;
    --bg2: #0b1630;
    --bg3: #111e3c;
    --ground: #111827;
    --ground2: #1f2d3d;
    --player1: #8ae7ff;
    --player2: #dffcff;
    --danger1: #ff5a5a;
    --danger2: #ff9c80;
    --gold: #ffd166;
    --panel: rgba(10, 16, 25, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

const groundHeight = 72;
const baseGravity = 1900;
const jumpVelocity = 760;
const lowJumpGravity = 2600;
const maxFallSpeed = 1600;

const state = {
  mode: "ready",
  score: 0,
  speed: 360,
  elapsed: 0,
  flash: 0,
  spawnTimer: 1.1,
  jumpHeld: false,
  best: 0
};

const player = {
  x: 150,
  y: 0,
  w: 32,
  h: 32,
  vy: 0,
  onGround: false,
  groundedTimer: 0,
  coyote: 0
};

const stars = [];
const obstacles = [];
const particles = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (player.y === 0) {
    resetPlayerToGround();
  }
}
window.addEventListener("resize", resize);
resize();

function resetPlayerToGround() {
  player.y = height - groundHeight - player.h;
  player.vy = 0;
  player.onGround = true;
  player.groundedTimer = 0;
  player.coyote = 0;
}

function buildStars() {
  stars.length = 0;
  const count = Math.max(60, Math.min(140, Math.floor(width / 18)));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * (height * 0.68),
      r: rand(1.1, 2.8),
      a: rand(0.3, 1),
      s: rand(0.7, 1.7)
    });
  }
}
buildStars();

function reset() {
  state.mode = "ready";
  state.score = 0;
  state.speed = 360;
  state.elapsed = 0;
  state.flash = 0;
  state.spawnTimer = 1.1;
  state.jumpHeld = false;
  obstacles.length = 0;
  particles.length = 0;
  player.x = 170;
  player.vy = 0;
  resetPlayerToGround();
}

function startRun() {
  if (state.mode === "playing") return;
  if (state.mode === "gameover") {
    reset();
  }
  state.mode = "playing";
  player.vy = 0;
  jump();
}

function jump() {
  if (state.mode === "ready") {
    startRun();
    return;
  }

  if (state.mode !== "playing") return;

  if (player.onGround || player.coyote > 0) {
    player.vy = -jumpVelocity;
    player.onGround = false;
    player.coyote = 0;
    state.jumpHeld = true;
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: player.x + player.w * 0.5,
        y: player.y + player.h,
        vx: rand(-60, 60),
        vy: rand(-50, 30),
        life: rand(0.2, 0.55),
        size: rand(2, 6),
        color: i % 2 === 0 ? "#dffcff" : "#8ae7ff"
      });
    }
  }
}

function onPointerDown() {
  if (state.mode === "ready") {
    startRun();
    return;
  }
  if (state.mode === "gameover") {
    reset();
    startRun();
    return;
  }
  jump();
}

document.addEventListener("pointerdown", onPointerDown);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    if (state.mode === "ready") {
      startRun();
    } else if (state.mode === "gameover") {
      reset();
      startRun();
    } else {
      jump();
    }
  }

  if (e.code === "ArrowUp" || e.code === "KeyW") {
    state.jumpHeld = true;
  }
});

document.addEventListener("keyup", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    state.jumpHeld = false;
  }
});

function addObstacle() {
  const coinFlip = Math.random();
  if (coinFlip < 0.55) {
    const w = rand(24, 54);
    const h = rand(28, 80);
    obstacles.push({
      x: width + 30,
      y: height - groundHeight - h,
      w,
      h,
      type: "block",
      color: "#ff5a5a"
    });
  } else {
    const h = rand(28, 70);
    obstacles.push({
      x: width + 30,
      y: height - groundHeight - h,
      w: h * 0.72,
      h,
      type: "spike",
      color: "#ff7b7b"
    });
  }
}

function rectHit(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update(dt) {
  state.elapsed += dt;

  if (state.mode === "ready") {
    state.flash = Math.max(0, state.flash - dt * 2.8);
    return;
  }

  if (state.mode === "gameover") {
    state.flash = Math.max(0, state.flash - dt * 3.5);
    return;
  }

  state.score += dt * 11.5;
  state.speed = Math.min(1120, 360 + state.elapsed * 10.4);

  const gravity = state.jumpHeld && player.vy < 0 ? lowJumpGravity : baseGravity;
  player.vy += gravity * dt;
  player.vy = Math.min(player.vy, maxFallSpeed);
  player.y += player.vy * dt;

  const floorY = height - groundHeight;
  if (player.y + player.h >= floorY) {
    player.y = floorY - player.h;
    player.vy = 0;
    player.onGround = true;
    player.groundedTimer = 0.08;
  } else {
    player.onGround = false;
  }

  if (player.groundedTimer > 0) {
    player.groundedTimer -= dt;
  }
  if (!player.onGround) {
    player.coyote = Math.max(0, player.coyote - dt);
  } else {
    player.coyote = 0.12;
  }

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    addObstacle();
    const pace = Math.max(0.72, 1.28 - Math.min(0.5, state.elapsed / 30));
    state.spawnTimer = pace;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.x -= state.speed * dt;

    if (ob.x + ob.w < -10) {
      obstacles.splice(i, 1);
      continue;
    }

    if (rectHit(player, ob)) {
      state.mode = "gameover";
      state.flash = 1;
      state.best = Math.max(state.best, Math.floor(state.score));
      for (let j = 0; j < 24; j++) {
        particles.push({
          x: player.x + player.w * 0.5,
          y: player.y + player.h * 0.5,
          vx: rand(-300, 300),
          vy: rand(-220, 120),
          life: rand(0.4, 0.9),
          size: rand(3, 9),
          color: j % 2 === 0 ? "#8ae7ff" : "#ff7b7b"
        });
      }
      break;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, height);
  sky.addColorStop(0, "#050b14");
  sky.addColorStop(0.45, "#0d1b2d");
  sky.addColorStop(1, "#102039");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);

  for (const s of stars) {
    ctx.fillStyle = "rgba(255,255,255," + s.a + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.s, 0, Math.PI * 2);
    ctx.fill();
  }

  const glow = ctx.createRadialGradient(width * 0.75, height * 0.18, 20, width * 0.75, height * 0.18, 420);
  glow.addColorStop(0, "rgba(116, 218, 255, 0.45)");
  glow.addColorStop(1, "rgba(116, 218, 255, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  const lineAlpha = 0.1 + Math.sin(state.elapsed * 2.2) * 0.02;
  ctx.strokeStyle = "rgba(130, 192, 255, " + lineAlpha + ")";
  ctx.lineWidth = 1;
  for (let x = 0; x < width; x += 42) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
}

function drawGround() {
  const groundY = height - groundHeight;
  const grad = ctx.createLinearGradient(0, groundY, 0, height);
  grad.addColorStop(0, "#1b2c3a");
  grad.addColorStop(1, "#0d1721");
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, width, groundHeight);

  ctx.fillStyle = "#0f1d2a";
  ctx.fillRect(0, groundY + 20, width, 2);

  const stripeOffset = (state.elapsed * state.speed * 0.18) % 36;
  ctx.fillStyle = "rgba(138,231,255,0.13)";
  for (let x = -38; x < width + 38; x += 38) {
    ctx.fillRect(x - stripeOffset, groundY + 30, 20, 8);
  }
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  ctx.save();
  ctx.translate(x + player.w / 2, y + player.h / 2);

  const g = ctx.createLinearGradient(-player.w / 2, -player.h / 2, player.w / 2, player.h / 2);
  g.addColorStop(0, "#dffcff");
  g.addColorStop(1, "#8ae7ff");
  ctx.fillStyle = g;

  const pulse = 1 + Math.sin(state.elapsed * 15) * 0.055;
  ctx.scale(pulse, pulse);
  ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);

  ctx.fillStyle = "rgba(15, 20, 40, 0.5)";
  ctx.fillRect(-player.w * 0.15, -player.h * 0.12, player.w * 0.28, player.h * 0.32);
  ctx.restore();
}

function drawObstacles() {
  for (const ob of obstacles) {
    ctx.save();
    ctx.translate(ob.x, ob.y);

    if (ob.type === "block") {
      const grad = ctx.createLinearGradient(0, 0, ob.w, ob.h);
      grad.addColorStop(0, "#ff9d7a");
      grad.addColorStop(1, "#ff5a5a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, ob.w, ob.h);

      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.fillRect(4, 4, ob.w - 8, 6);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, ob.h - 6, ob.w, 6);
    } else {
      ctx.fillStyle = "#ff5a5a";
      ctx.beginPath();
      ctx.moveTo(0, ob.h);
      ctx.lineTo(ob.w / 2, 0);
      ctx.lineTo(ob.w, ob.h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(0, ob.h - 6, ob.w, 6);
    }

    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 1.7);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

function drawHud() {
  ctx.fillStyle = "rgba(8, 12, 18, 0.38)";
  ctx.fillRect(18, 18, 220, 54);
  ctx.strokeStyle = "rgba(138,231,255,0.6)";
  ctx.strokeRect(18, 18, 220, 54);

  ctx.fillStyle = "#e8fcff";
  ctx.font = "bold 18px Arial";
  ctx.fillText("Stevdash", 32, 46);

  ctx.fillStyle = "#ffd166";
  ctx.font = "bold 16px Arial";
  ctx.fillText("Score: " + Math.floor(state.score), 32, 62);

  if (state.mode === "ready") {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(width * 0.2, height * 0.25, width * 0.6, height * 0.28);

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 52px Arial";
    ctx.fillText("Stevdash", width / 2, height * 0.4);

    ctx.fillStyle = "#dffcff";
    ctx.font = "bold 22px Arial";
    ctx.fillText("Click or press space to start", width / 2, height * 0.48);

    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 18px Arial";
    ctx.fillText("Geometry Dash style physics", width / 2, height * 0.54);
    ctx.textAlign = "left";
  }

  if (state.mode === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.fillRect(width * 0.2, height * 0.26, width * 0.6, height * 0.3);

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.font = "bold 56px Arial";
    ctx.fillText("Stevdash", width / 2, height * 0.4);

    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 26px Arial";
    ctx.fillText("Score: " + Math.floor(state.score), width / 2, height * 0.49);

    ctx.fillStyle = "#dffcff";
    ctx.font = "bold 18px Arial";
    ctx.fillText("Click or press space to restart", width / 2, height * 0.58);
    ctx.textAlign = "left";
  }
}

function drawFlash() {
  if (state.flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + state.flash * 0.44 + ")";
    ctx.fillRect(0, 0, width, height);
  }
}

function render() {
  drawBackground();
  drawGround();
  drawParticles();
  drawObstacles();
  drawPlayer();
  drawHud();
  drawFlash();
}

let previous = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - previous) / 1000 || 0.016);
  previous = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
