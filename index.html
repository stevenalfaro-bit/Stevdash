<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stevdash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #050b14 0%, #0d1b2d 45%, #102039 100%);
    image-rendering: pixelated;
  }
  #ui {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 16px;
    z-index: 100;
    background: rgba(0,0,0,0.5);
    padding: 10px 15px;
    border: 1px solid #8ae7ff;
    border-radius: 4px;
  }
  #score { color: #ffd166; font-weight: bold; }
  #mode { color: #8ae7ff; font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="mode"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let w = window.innerWidth, h = window.innerHeight;
canvas.width = w;
canvas.height = h;

const GROUND_Y = h - 80;
const GRAVITY = 1900;
const JUMP_POWER = 760;
const LOW_GRAVITY = 2600;
const MAX_FALL = 1600;

const levels = [
  { name: 'Easy', speed: 300, spawnGap: 1.8, scale: 0.7 },
  { name: 'Normal', speed: 420, spawnGap: 1.2, scale: 1.0 },
  { name: 'Hard', speed: 540, spawnGap: 0.9, scale: 1.3 },
  { name: 'Insane', speed: 660, spawnGap: 0.65, scale: 1.6 },
  { name: 'Extreme', speed: 780, spawnGap: 0.45, scale: 2.0 }
];

let gameState = 'menu';
let currentLevel = 0;
let score = 0;
let gameTime = 0;
let gameSpeed = 300;
let spawnRate = 1.2;
let isWaveMode = false;
let jumpHeld = false;

const player = {
  x: 100,
  y: GROUND_Y,
  w: 28,
  h: 28,
  vy: 0,
  onGround: true,
  coyoteTime: 0,
  rotation: 0
};

const obstacles = [];
const particles = [];
const stars = [];

function buildStars() {
  stars.length = 0;
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * (h * 0.7),
      r: Math.random() * 2 + 1,
      a: Math.random() * 0.7 + 0.3
    });
  }
}
buildStars();

window.addEventListener('resize', () => {
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w;
  canvas.height = h;
});

function startLevel(lvl) {
  gameState = 'playing';
  currentLevel = lvl;
  isWaveMode = false;
  score = 0;
  gameTime = 0;
  gameSpeed = levels[lvl].speed;
  spawnRate = levels[lvl].spawnGap;
  player.x = 100;
  player.y = GROUND_Y;
  player.vy = 0;
  player.onGround = true;
  player.rotation = 0;
  obstacles.length = 0;
  particles.length = 0;
  document.getElementById('mode').textContent = 'Level: ' + levels[lvl].name;
}

function startWave() {
  gameState = 'playing';
  isWaveMode = true;
  score = 0;
  gameTime = 0;
  gameSpeed = 300;
  spawnRate = 1.2;
  player.x = 100;
  player.y = GROUND_Y;
  player.vy = 0;
  player.onGround = true;
  player.rotation = 0;
  obstacles.length = 0;
  particles.length = 0;
  document.getElementById('mode').textContent = 'Wave Mode';
}

function addObstacle() {
  const scale = isWaveMode ? 1.0 : levels[currentLevel].scale;
  const type = Math.random() < 0.5 ? 'block' : 'spike';
  const w_size = 24 * scale;
  const h_size = 50 * scale;
  
  obstacles.push({
    x: w + 30,
    y: GROUND_Y - h_size,
    w: w_size,
    h: h_size,
    type: type
  });
}

function jump() {
  if (gameState !== 'playing') return;
  if (player.onGround || player.coyoteTime > 0) {
    player.vy = -JUMP_POWER;
    player.onGround = false;
    player.coyoteTime = 0;
    
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: player.x + player.w / 2,
        y: player.y + player.h,
        vx: (Math.random() - 0.5) * 100,
        vy: Math.random() * -50 - 20,
        life: 0.4,
        color: i % 2 ? '#8ae7ff' : '#dffcff'
      });
    }
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (gameState === 'menu') {
      drawLevelMenu();
    } else if (gameState === 'levelSelect') {
      // handle in input
    } else {
      jump();
      jumpHeld = true;
    }
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    jumpHeld = false;
  }
});

canvas.addEventListener('click', (e) => {
  if (gameState === 'menu') {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left);
    const y = (e.clientY - rect.top);
    
    // Play Levels button
    if (x > w/2 - 100 && x < w/2 + 100 && y > h/2 - 80 && y < h/2 - 20) {
      gameState = 'levelSelect';
    }
    // Wave Mode button
    if (x > w/2 - 100 && x < w/2 + 100 && y > h/2 + 20 && y < h/2 + 80) {
      startWave();
    }
  } else if (gameState === 'levelSelect') {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left);
    const y = (e.clientY - rect.top);
    
    const btnW = 120, btnH = 60;
    const cols = 3;
    const startX = w/2 - (cols * btnW + (cols-1)*10)/2;
    const startY = h/2 - 80;
    
    for (let i = 0; i < levels.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const bx = startX + col * (btnW + 10);
      const by = startY + row * (btnH + 10);
      
      if (x > bx && x < bx + btnW && y > by && y < by + btnH) {
        startLevel(i);
        return;
      }
    }
    
    // Back button
    if (x > w/2 - 50 && x < w/2 + 50 && y > h - 100) {
      gameState = 'menu';
    }
  } else if (gameState === 'playing') {
    jump();
  } else if (gameState === 'gameover') {
    gameState = 'menu';
  }
});

function update(dt) {
  if (gameState !== 'playing') return;
  
  gameTime += dt;
  score += dt * 10;
  
  if (isWaveMode) {
    gameSpeed = 300 + gameTime * 15;
    player.rotation += dt * 180;
    const wave = Math.sin(gameTime * 3) * 60;
    player.y = GROUND_Y + wave - player.h/2;
  } else {
    gameSpeed = levels[currentLevel].speed + gameTime * 5;
  }
  
  const gravity = jumpHeld && player.vy < 0 ? LOW_GRAVITY : GRAVITY;
  player.vy += gravity * dt;
  player.vy = Math.min(player.vy, MAX_FALL);
  
  if (!isWaveMode) {
    player.y += player.vy * dt;
    
    if (player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.coyoteTime = 0.1;
    } else {
      player.onGround = false;
      player.coyoteTime -= dt;
    }
  }
  
  let spawnTimer = 0;
  if (!this.lastSpawn) this.lastSpawn = 0;
  this.lastSpawn -= dt;
  if (this.lastSpawn <= 0) {
    addObstacle();
    this.lastSpawn = spawnRate * (1 - gameTime / 60);
  }
  
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= gameSpeed * dt;
    
    if (obstacles[i].x < -50) {
      obstacles.splice(i, 1);
      continue;
    }
    
    if (collides(player, obstacles[i])) {
      gameState = 'gameover';
      for (let j = 0; j < 20; j++) {
        particles.push({
          x: player.x + player.w/2,
          y: player.y + player.h/2,
          vx: (Math.random()-0.5)*400,
          vy: (Math.random()-0.5)*400,
          life: 0.6,
          color: j % 2 ? '#ff5a5a' : '#ff9d7a'
        });
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx * dt;
    particles[i].y += particles[i].vy * dt;
    particles[i].vy += 600 * dt;
    particles[i].life -= dt;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

function collides(player, obstacle) {
  return player.x < obstacle.x + obstacle.w &&
         player.x + player.w > obstacle.x &&
         player.y < obstacle.y + obstacle.h &&
         player.y + player.h > obstacle.y;
}

function render() {
  ctx.fillStyle = 'rgba(5,11,20,1)';
  ctx.fillRect(0, 0, w, h);
  
  const glow = ctx.createRadialGradient(w*0.7, h*0.15, 20, w*0.7, h*0.15, 400);
  glow.addColorStop(0, 'rgba(90,214,255,0.3)');
  glow.addColorStop(1, 'rgba(90,214,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.fillStyle = '#1b2c3a';
  ctx.fillRect(0, GROUND_Y, w, h - GROUND_Y);
  
  ctx.fillStyle = 'rgba(138,231,255,0.1)';
  for (let x = 0; x < w; x += 40) {
    ctx.fillRect(x, GROUND_Y + 30, 20, 6);
  }
  
  for (const obs of obstacles) {
    ctx.fillStyle = '#ff5a5a';
    if (obs.type === 'spike') {
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.h);
      ctx.lineTo(obs.x + obs.w/2, obs.y);
      ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    }
  }
  
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
  
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.rotate(player.rotation * Math.PI / 180);
  const grad = ctx.createLinearGradient(-player.w/2, -player.h/2, player.w/2, player.h/2);
  grad.addColorStop(0, '#dffcff');
  grad.addColorStop(1, '#8ae7ff');
  ctx.fillStyle = grad;
  ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
  ctx.restore();
  
  document.getElementById('score').textContent = 'Score: ' + Math.floor(score);
  
  if (gameState === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Stevdash', w/2, h/2 - 120);
    
    ctx.fillStyle = '#ffd166';
    ctx.font = '20px Arial';
    ctx.fillText('Choose Game Mode', w/2, h/2 - 20);
    
    ctx.fillStyle = '#8ae7ff';
    ctx.strokeStyle = '#8ae7ff';
    ctx.lineWidth = 2;
    ctx.fillRect(w/2 - 100, h/2 - 80, 200, 50);
    ctx.strokeRect(w/2 - 100, h/2 - 80, 200, 50);
    ctx.fillStyle = '#000';
    ctx.font = '18px Arial';
    ctx.fillText('Play Levels', w/2, h/2 - 50);
    
    ctx.fillStyle = '#ff9d7a';
    ctx.strokeStyle = '#ff9d7a';
    ctx.fillRect(w/2 - 100, h/2 + 20, 200, 50);
    ctx.strokeRect(w/2 - 100, h/2 + 20, 200, 50);
    ctx.fillStyle = '#000';
    ctx.fillText('Wave Mode', w/2, h/2 + 50);
    
    ctx.textAlign = 'left';
  } else if (gameState === 'levelSelect') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Select Level', w/2, 80);
    
    const btnW = 120, btnH = 60;
    const cols = 3;
    const startX = w/2 - (cols * btnW + (cols-1)*10)/2;
    const startY = h/2 - 80;
    
    for (let i = 0; i < levels.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const bx = startX + col * (btnW + 10);
      const by = startY + row * (btnH + 10);
      
      ctx.fillStyle = '#ff5a5a';
      ctx.strokeStyle = '#ff9d7a';
      ctx.lineWidth = 2;
      ctx.fillRect(bx, by, btnW, btnH);
      ctx.strokeRect(bx, by, btnW, btnH);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(levels[i].name, bx + btnW/2, by + btnH/2 + 5);
    }
    
    ctx.fillStyle = '#dffcff';
    ctx.strokeStyle = '#dffcff';
    ctx.lineWidth = 2;
    ctx.fillRect(w/2 - 50, h - 80, 100, 40);
    ctx.strokeRect(w/2 - 50, h - 80, 100, 40);
    ctx.fillStyle = '#000';
    ctx.font = '14px Arial';
    ctx.fillText('Back', w/2, h - 50);
    
    ctx.textAlign = 'left';
  } else if (gameState === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', w/2, h/2 - 60);
    
    ctx.fillStyle = '#ffd166';
    ctx.font = '28px Arial';
    ctx.fillText('Score: ' + Math.floor(score), w/2, h/2 + 20);
    
    ctx.fillStyle = '#dffcff';
    ctx.font = '16px Arial';
    ctx.fillText('Click to return to menu', w/2, h/2 + 80);
    
    ctx.textAlign = 'left';
  }
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.016) || 0.016;
  lastTime = t;
  
  update(dt);
  render();
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
